# Full replacement content for nginx's default site config, adding a
# reverse-proxy location for the Coding Server app at /coding-server/,
# alongside the existing stock nginx placeholder content (left untouched).
#
# --- Which file to edit ---
# Depends on how nginx was installed:
#   - Debian/Ubuntu package (e.g. `apt install nginx`): the live file is
#     /etc/nginx/sites-available/default, symlinked from sites-enabled/.
#     /etc/nginx/conf.d/ exists but is empty and NOT where the site config
#     lives -- dropping this file there does nothing on this layout.
#   - Official nginx Docker image / some RPM-based installs: the live file
#     is /etc/nginx/conf.d/default.conf instead, and there's no
#     sites-available/sites-enabled at all.
# Check which applies with:
#   ls /etc/nginx/sites-available/ /etc/nginx/conf.d/
# and confirm with `nginx -T | head -5` which file nginx.conf actually
# `include`s before you edit.
#
# --- Why this replaces the whole file instead of just adding a snippet ---
# nginx.conf does `include conf.d/*.conf;` / `include sites-enabled/*;` at
# the top level, so a bare `location` block outside a `server {}` block is
# invalid there. There's no clean way to inject a location into the
# existing server block from a separate file without hitting that, so the
# two new location blocks below are added directly into the file itself.
#
# IMPORTANT: the live file may already have location blocks for other
# apps sharing this nginx instance (e.g. a /game-server/ proxy) that
# aren't tracked in this repo. Diff against the live file before doing a
# blind select-all-and-replace, or you'll delete that app's routing.
#
# --- Install ---
#   sudo vi /etc/nginx/sites-available/default   # or conf.d/default.conf -- see above
#   (select-all, delete, paste this file's content in -- after merging in
#   any other apps' location blocks the live file already has -- save)
#   sudo nginx -t && sudo systemctl reload nginx
#
# --- Changing the path ---
# To use something other than /coding-server/, replace every occurrence
# of "/coding-server" below (the two `location` lines and the
# `X-Script-Name` header) with your new path. They must match exactly,
# including no trailing slash on the X-Script-Name value.

server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Browsers request these at the domain root automatically (favicon,
    # robots.txt, Apple's touch-icon variants) regardless of what page or
    # sub-path you're actually visiting. None of them exist here, and a
    # plain 404 from the / location above would fail nginx's own disk
    # lookup -- which is exactly what the nginx-404-probe fail2ban filter
    # (see deploy/fail2ban/) treats as scanner activity. That filter has
    # banned real visitors' IPs just for loading /coding-server/ in a
    # browser. log_not_found/access_log off keeps these out of
    # error.log entirely, so they can never trip the filter no matter
    # how many browsers hit them.
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /robots.txt { access_log off; log_not_found off; return 204; }
    location = /apple-touch-icon.png { access_log off; log_not_found off; return 204; }
    location = /apple-touch-icon-precomposed.png { access_log off; log_not_found off; return 204; }

    # --- Coding Server app ---

    # Redirect requests missing the trailing slash (e.g. someone visits
    # /coding-server with no slash) so they still land on the app instead
    # of falling through to the / location above.
    location = /coding-server {
        return 301 /coding-server/;
    }

    location /coding-server/ {
        proxy_pass http://127.0.0.1:8080/;

        # $http_host, NOT $host: nginx's $host variable silently strips the
        # port from the Host header, so the backend app would build
        # redirect/next-page URLs missing the port whenever this is
        # accessed via a non-default port (e.g. through an SSH tunnel for
        # testing). $http_host preserves the Host header exactly as the
        # client sent it. Harmless either way on the real port-80 URL
        # students use, but $http_host is correct in both cases.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tells app.py's ReverseProxied WSGI middleware what prefix nginx
        # stripped, so Flask's url_for()/redirect() generate URLs that
        # still include /coding-server -- without this, a post-login
        # redirect would send the browser to "/" instead and miss the
        # app entirely.
        proxy_set_header X-Script-Name /coding-server;
    }
}
