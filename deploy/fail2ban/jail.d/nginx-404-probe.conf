# Save as: /etc/fail2ban/jail.d/nginx-404-probe.conf
#
# Pairs with filter.d/nginx-404-probe.conf. maxretry is set low (3) and
# findtime is set long (1 day) because the filter itself is already very
# precise -- it only matches nginx trying (and failing) to serve a file
# straight off disk for a path that isn't one of the app's real proxied
# routes. A legitimate visitor should never trigger this even once, so
# there's little false-positive risk in banning after just a few hits,
# even if they're spread out over hours (which is typical: most scanners
# only try a given host once or twice, not in a rapid burst).

[nginx-404-probe]
enabled  = true
filter   = nginx-404-probe
logpath  = /var/log/nginx/error.log
port     = http,https
maxretry = 3
findtime = 1d
bantime  = 1d

# Optional: ban repeat offenders for longer each time instead of a flat
# 1 day. Uncomment to enable (needs fail2ban >= 0.11, which the Ubuntu/
# Debian package already provides):
# bantime.increment = true
# bantime.factor    = 4
# bantime.maxtime   = 4w

# Add your own IP (and/or a stable campus/VPN range) here so you can
# never lock yourself out while testing. Left as a placeholder in the
# repo on purpose -- fill in your real IP only in the live copy under
# /etc/fail2ban/jail.d/ on the server, not here.
# ignoreip = 127.0.0.1/8 ::1 <your-ip-here>
