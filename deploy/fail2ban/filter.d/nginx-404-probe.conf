# Save as: /etc/fail2ban/filter.d/nginx-404-probe.conf
#
# fail2ban filter: nginx 404-probing (vulnerability/path scanners)
#
# Matches nginx error-log lines where nginx tried to serve a request
# directly off disk (i.e. the request didn't match any proxied
# location block) and the file genuinely doesn't exist. This is the
# signature of automated scanners probing for exposed .env/.git files,
# known CMS/router/appliance exploit paths, etc. -- not real traffic to
# the app, since app requests are proxied to gunicorn and never reach
# nginx's own static-file lookup.
#
# Deliberately does NOT match proxy/upstream errors (connect() failed,
# upstream timed out, etc.) -- those can happen during a genuine app
# outage and banning the client making them would be wrong.

[Definition]

failregex = ^\s*\[error\] \d+#\d+: \*\d+ open\(\) ".*" failed \(2: No such file or directory\), client: <HOST>,
            ^\s*\[error\] \d+#\d+: \*\d+ ".*" is not found \(2: No such file or directory\), client: <HOST>,

ignoreregex =
